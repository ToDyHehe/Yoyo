<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDy Commissions</title>
  <meta name="description" content="Character design commissions by ToDy — OCs, D&D characters, reference sheets, greyscale & sketch.">
  <meta property="og:title" content="ToDy — Commissions OPEN">
  <meta property="og:description" content="OCs · D&D characters · reference sheets · greyscale & sketch. Prices from $8.">
  <meta property="og:image" content="img/ref-henry.jpg">
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 860px; padding-bottom: 48px; }
    .hero { padding: 28px 0 8px; }
    .hero h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 900; letter-spacing: -.04em; margin: 0; }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 1.05rem; margin: 6px 0 14px; }
    .open { display: inline-block; background: var(--accent); color: #fff; font-weight: 800; padding: 4px 12px; border-radius: 999px; font-size: .85rem; letter-spacing: .04em; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .gallery a { display: block; border-radius: 12px; overflow: hidden; background: var(--surface-2); aspect-ratio: 1; }
    .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
    .gallery a:hover img { transform: scale(1.03); }
    .gallery a.wide { grid-column: span 2; aspect-ratio: auto; }
    .price-table { width: 100%; border-collapse: collapse; }
    .price-table th, .price-table td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .price-table th { font-size: .8rem; color: var(--muted); font-weight: 600; }
    .price-table td.p { font-weight: 800; white-space: nowrap; }
    .price-table tr.star td { background: var(--accent-soft); }
    .price-table .d { font-size: .85rem; color: var(--muted); }
    details.tos { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
    details.tos summary { cursor: pointer; font-weight: 700; }
    details.tos h3 { margin-top: 1em; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
    .open.closed { background: var(--muted); }
    .loading { text-align: center; color: var(--muted); padding: 60px 0; }
    footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 32px; }
  </style>
</head>
<body>
  <main id="page"><div class="loading">Loading…</div></main>
  <div class="toast" id="toast"></div>
  <script src="commissions.js"></script>
</body>
</html>
