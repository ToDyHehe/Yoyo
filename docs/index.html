<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#141414">
  <title>ToDy Workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">ToDy<span>.</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="home"><span class="ico">🏠</span>Главная</button>
      <button data-tab="orders"><span class="ico">🖋</span>Заказы</button>
      <button data-tab="content"><span class="ico">📅</span>Контент</button>
      <button data-tab="templates"><span class="ico">💬</span>Шаблоны</button>
      <button data-tab="settings"><span class="ico">⚙️</span>Настройки</button>
    </nav>
    <button class="sync" id="sync" title="Синхронизация"><span class="dot"></span><span id="syncText">…</span></button>
  </header>

  <main id="view"></main>

  <dialog id="orderDlg">
    <form method="dialog" id="orderForm">
      <div class="dlg-head"><h3 id="orderDlgTitle" style="margin:0">Заказ</h3><span class="spacer"></span><button class="btn ghost small" value="cancel" formnovalidate>✕</button></div>
      <div class="dlg-body form-grid">
        <div><label>Клиент *</label><input name="client" required placeholder="Ник клиента"></div>
        <div><label>Контакт</label><input name="contact" placeholder="@ник (X), Discord, email"></div>
        <div><label>Тип</label><select name="type"></select></div>
        <div><label>Стиль</label><select name="style"><option>Sketch</option><option>Greyscale</option><option>Color</option></select></div>
        <div class="full"><label>Доп. опции</label><input name="extras" placeholder="фон, 2-й персонаж, срочно…"></div>
        <div><label>Цена, $</label><input name="price" type="number" min="0" step="1" inputmode="decimal"></div>
        <div><label>Оплачено, $</label><input name="paid" type="number" min="0" step="1" inputmode="decimal"></div>
        <div><label>Статус</label><select name="status"></select></div>
        <div><label>Дедлайн</label><input name="deadline" type="date"></div>
        <div><label>Потрачено часов</label><input name="hours" type="number" min="0" step="0.5" inputmode="decimal"></div>
        <div><label>Можно постить?</label><select name="canPost"><option value="yes">Да</option><option value="later">Позже</option><option value="no">Нет</option></select></div>
        <div class="full"><label>Заметки / референсы</label><textarea name="notes" placeholder="Ссылки на рефы, пожелания, детали…"></textarea></div>
      </div>
      <div class="dlg-foot">
        <button class="btn danger" type="button" id="orderDelete">Удалить</button>
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>Отмена</button>
        <button class="btn primary" value="save" id="orderSave">Сохранить</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
